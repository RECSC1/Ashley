<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Form Registration</title>
  </head>
  <body>
    <!-- Static Netlify form definitions required for Next.js runtime builds -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <input name="first_name" />
      <input name="last_name" />
      <input name="email" />
      <input name="phone" />
      <input name="interest" />
      <input name="timeline" />
      <textarea name="message"></textarea>
      <input name="page_name" />
      <input name="form_type" />
      <input name="lead_source" />
      <input name="client_name" />
      <input name="bot-field" />
    </form>

    <form name="property-alert-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="property-alert-interest" />
      <input name="name" />
      <input name="email" />
      <input name="area" />
      <input name="price" />
      <input name="beds" />
      <input name="baths" />
      <input name="timeline" />
      <textarea name="notes"></textarea>
      <input name="page_name" />
      <input name="form_type" />
      <input name="lead_source" />
      <input name="client_name" />
      <input name="bot-field" />
    </form>

    <form name="neighborhood-guide-request" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="neighborhood-guide-request" />
      <input name="name" />
      <input name="email" />
      <input name="guide_title" />
      <input name="page_name" />
      <input name="form_type" />
      <input name="lead_source" />
      <input name="client_name" />
      <input name="bot-field" />
    </form>

    <form name="market-update-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="market-update-signup" />
      <input name="email" />
      <input name="page_name" />
      <input name="form_type" />
      <input name="lead_source" />
      <input name="client_name" />
      <input name="bot-field" />
    </form>
  </body>
</html>
