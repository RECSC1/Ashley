[build]
command = "npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/admin"
to = "/admin/index.html"
status = 200
force = true

[[redirects]]
from = "/admin/"
to = "/admin/index.html"
status = 200
force = true
